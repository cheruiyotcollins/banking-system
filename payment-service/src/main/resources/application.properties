# Application name for Eureka registration
spring.application.name=payment-service

# Server port
server.port=9002

# MySQL DataSource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/skymarket?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=collo
spring.datasource.password=Kipkirui92?

# JPA & Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.datasource.initialization-mode=always

# Show SQL logs
spring.jpa.show-sql=true
hibernate.show_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate=DEBUG

# Swagger / OpenAPI settings
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Feign Client Configuration
feign.hystrix.enabled=false

# RabbitMQ settings
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.template.exchange=transactions.exchange
spring.rabbitmq.template.routing-key=transactions.routingKey
