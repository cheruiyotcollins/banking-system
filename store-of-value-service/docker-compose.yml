version: '3.8'
services:
  store-of-value:
    build: .
    container_name: store-of-value-service
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/store_of_value_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: collo
      SPRING_DATASOURCE_PASSWORD: Kipkirui92?
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  mysql:
    image: mysql:8.0
    container_name: store-of-value-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: store_of_value_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
